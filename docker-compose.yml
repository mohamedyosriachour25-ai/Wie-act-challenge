# docker compose up --build        (reads ./.env; copy .env.example first)
services:
  herwiego:
    build: .
    ports:
      - "8000:8000"
    environment:
      HERWIEGO_ENV: production
      HERWIEGO_SECRET: ${HERWIEGO_SECRET:?set HERWIEGO_SECRET in .env (openssl rand -hex 32)}
      HERWIEGO_BASE_URL: ${HERWIEGO_BASE_URL:?set HERWIEGO_BASE_URL in .env -- there is no built-in fallback}
      HERWIEGO_API_KEY: ${HERWIEGO_API_KEY:?set HERWIEGO_API_KEY in .env -- there is no built-in fallback}
      HERWIEGO_COMPACT_MODEL: ${HERWIEGO_COMPACT_MODEL:-compact-1b}
      HERWIEGO_MID_MODEL: ${HERWIEGO_MID_MODEL:-mid-8b}
      HERWIEGO_EMBED_MODEL: ${HERWIEGO_EMBED_MODEL:-embed-small}
      HERWIEGO_MIN_SIMILARITY: ${HERWIEGO_MIN_SIMILARITY:-0.1}
      HERWIEGO_MAX_CONCURRENT: ${HERWIEGO_MAX_CONCURRENT:-2}
      HERWIEGO_USER_AI_PER_MIN: ${HERWIEGO_USER_AI_PER_MIN:-20}
      HERWIEGO_TRUST_PROXY: ${HERWIEGO_TRUST_PROXY:-0}
      HERWIEGO_VIDEO_CAPACITY: ${HERWIEGO_VIDEO_CAPACITY:-6}
    volumes:
      - herwiego-data:/data
    restart: unless-stopped
volumes:
  herwiego-data:
