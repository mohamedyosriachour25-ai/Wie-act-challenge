# docker compose up --build        (reads ./.env; copy .env.example first)
services:
  ednova:
    build: .
    ports:
      - "8000:8000"
    environment:
      EDNOVA_ENV: production
      EDNOVA_SECRET: ${EDNOVA_SECRET:?set EDNOVA_SECRET in .env (openssl rand -hex 32)}
      EDNOVA_BASE_URL: ${EDNOVA_BASE_URL:-mock}
      EDNOVA_API_KEY: ${EDNOVA_API_KEY:-dev-mock-key}
      EDNOVA_COMPACT_MODEL: ${EDNOVA_COMPACT_MODEL:-compact-1b}
      EDNOVA_MID_MODEL: ${EDNOVA_MID_MODEL:-mid-8b}
      EDNOVA_EMBED_MODEL: ${EDNOVA_EMBED_MODEL:-embed-small}
      EDNOVA_MIN_SIMILARITY: ${EDNOVA_MIN_SIMILARITY:-0.1}
      EDNOVA_MAX_CONCURRENT: ${EDNOVA_MAX_CONCURRENT:-2}
      EDNOVA_USER_AI_PER_MIN: ${EDNOVA_USER_AI_PER_MIN:-20}
      EDNOVA_TRUST_PROXY: ${EDNOVA_TRUST_PROXY:-0}
      EDNOVA_VIDEO_CAPACITY: ${EDNOVA_VIDEO_CAPACITY:-6}
    volumes:
      - ednova-data:/data
    restart: unless-stopped
volumes:
  ednova-data:
