name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run i18n:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ednova:ci .
      - name: container starts and reports healthy
        run: |
          docker run -d --name ednova -p 8000:8000 -e EDNOVA_SECRET=$(openssl rand -hex 32) ednova:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/api/health && exit 0; sleep 1; done
          docker logs ednova; exit 1
